<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECTS — ADMIN</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="global-grid"></div>
    
    <nav id="admin-nav">
        <a href="/admin/dashboard.html" class="nav-logo">ADMIN<span>_CORE</span></a>
        <div class="nav-links">
            <a href="/admin/dashboard.html" class="nav-link">Dashboard</a>
            <a href="/admin/projects.html" class="nav-link active">Projects</a>
            <a href="/admin/skills.html" class="nav-link">Skills</a>
            <a href="/admin/profile.html" class="nav-link">Profile</a>
            <a href="/" class="nav-link">View Site</a>
            <button id="logoutBtn" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
        </div>
    </nav>

    <main class="admin-main">
        <div class="container">
            <div class="section-label">Manage.Projects</div>
            <h1 class="section-heading">Projects</h1>

            <div class="admin-content">
                <div class="projects-list" id="projectsList">
                    <p style="color: var(--text-muted);">Loading projects...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="admin.js"></script>
    <script>
        async function loadProjects() {
            try {
                const res = await fetch('http://localhost:3001/api/projects');
                const data = await res.json();
                
                const list = document.getElementById('projectsList');
                
                if (!data.projects || data.projects.length === 0) {
                    list.innerHTML = '<p style="color: var(--text-muted);">No projects yet.</p>';
                    return;
                }
                
                list.innerHTML = data.projects.map(p => `
                    <div class="project-item">
                        <h3>${p.name}</h3>
                        <p>${p.description}</p>
                        <div class="project-meta">
                            <span>${p.category}</span>
                            <span>${p.tech?.join(', ')}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('projectsList').innerHTML = '<p style="color: var(--accent-red);">Error loading projects</p>';
            }
        }

        loadProjects();
    </script>
</body>
</html>
