<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILLS — ADMIN</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="global-grid"></div>
    
    <nav id="admin-nav">
        <a href="/admin/dashboard.html" class="nav-logo">ADMIN<span>_CORE</span></a>
        <div class="nav-links">
            <a href="/admin/dashboard.html" class="nav-link">Dashboard</a>
            <a href="/admin/projects.html" class="nav-link">Projects</a>
            <a href="/admin/skills.html" class="nav-link active">Skills</a>
            <a href="/admin/profile.html" class="nav-link">Profile</a>
            <a href="/" class="nav-link">View Site</a>
            <button id="logoutBtn" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
        </div>
    </nav>

    <main class="admin-main">
        <div class="container">
            <div class="section-label">Manage.Skills</div>
            <h1 class="section-heading">Skills</h1>

            <div class="admin-content">
                <div class="skills-list" id="skillsList">
                    <p style="color: var(--text-muted);">Loading skills...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="admin.js"></script>
    <script>
        async function loadSkills() {
            try {
                const res = await fetch('http://localhost:3001/api/skills');
                const data = await res.json();
                
                const list = document.getElementById('skillsList');
                
                if (!data.skills || data.skills.length === 0) {
                    list.innerHTML = '<p style="color: var(--text-muted);">No skills yet.</p>';
                    return;
                }
                
                list.innerHTML = data.skills.map(s => `
                    <div class="skill-item">
                        <h3>${s.category}</h3>
                        <ul>
                            ${s.items?.map(item => `<li>${item.name} - ${item.level}%</li>`).join('') || ''}
                        </ul>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading skills:', error);
                document.getElementById('skillsList').innerHTML = '<p style="color: var(--accent-red);">Error loading skills</p>';
            }
        }

        loadSkills();
    </script>
</body>
</html>
